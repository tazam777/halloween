<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mochi the Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Chewy&family=Patrick+Hand&display=swap">
<style>
:root{
  --night:#1a1030;--night-2:#2a1a48;--blood:#ff3b6b;--pumpkin:#ff9a3c;--bubblegum:#ff9fd0;--lilac:#c4a6ff;--cream:#fff4ea;
  --f-display:"Creepster","Impact",sans-serif;
  --f-cute:"Chewy","Comic Sans MS","Trebuchet MS",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS","Trebuchet MS",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:radial-gradient(ellipse at 70% 0%,#4a2a78 0%,var(--night) 65%) fixed,var(--night);
  color:var(--cream);font-family:var(--f-hand);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.jolt{animation:jolt .35s}
@keyframes jolt{0%,100%{transform:none}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,1px)}}

nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
nav a{font-family:var(--f-cute);font-size:1.05rem;color:var(--lilac);text-decoration:none;background:rgba(196,166,255,.14);border-radius:999px;padding:0 16px;min-height:44px;display:inline-flex;align-items:center}
nav a[aria-current="page"]{background:var(--bubblegum);color:#3a1240}

header{text-align:center}
.eyebrow{margin:0;font-family:var(--f-cute);font-size:1.2rem;letter-spacing:.08em;color:var(--bubblegum)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(3rem,15vw,4.8rem);line-height:1;letter-spacing:.04em;color:var(--blood);text-shadow:0 0 18px rgba(255,59,107,.45),3px 3px 0 var(--night)}
.sub{margin:6px 0 0;font-size:1.2rem}

/* mood meter */
.meter{background:rgba(196,166,255,.12);border:2px solid rgba(196,166,255,.35);border-radius:22px;padding:12px}
.meter-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;font-size:1.15rem;color:var(--lilac)}
.meter-top b{font-family:var(--f-cute);font-weight:400;font-size:1.45rem;color:var(--bubblegum)}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;background:rgba(26,16,48,.45);font-size:.92rem;line-height:1.05;text-align:center;color:rgba(255,244,234,.6);transition:transform .25s,background .25s,color .25s,box-shadow .25s}
.chip .e{font-size:1.5rem}
.chip.on{background:var(--bubblegum);color:#3a1240;transform:translateY(-3px);box-shadow:0 4px 0 #c75b9a}
.chip[data-k="moody"].on{background:var(--lilac);box-shadow:0 4px 0 #7a5ac0}
.track{position:relative;height:12px;margin:14px 10px 4px;border-radius:99px;background:linear-gradient(90deg,var(--bubblegum),var(--pumpkin) 35%,var(--lilac) 68%,#5a4a7a)}
.track i{position:absolute;top:50%;left:40%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--cream);border:3px solid var(--night);transition:left .45s cubic-bezier(.3,1.4,.5,1)}

/* stage */
.stage{position:relative;border-radius:26px;overflow:hidden;border:3px solid var(--bubblegum);box-shadow:0 0 0 6px var(--night),0 0 0 9px var(--lilac);
  background:radial-gradient(ellipse at 50% 88%,rgba(255,159,208,.2),transparent 60%),linear-gradient(180deg,#2c1b4e,#3d2569);
  padding:64px 16px 22px;display:flex;justify-content:center}
.rug{position:absolute;left:50%;bottom:14px;width:min(80%,320px);height:40px;transform:translateX(-50%);border-radius:50%;background:repeating-radial-gradient(ellipse at center,#ff9fd0 0 6px,#c4a6ff 6px 12px);opacity:.5}
.catbox{position:relative;width:min(70vw,280px);aspect-ratio:156/158;z-index:1}
#cat{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%}

/* mood: faces, ears, blush */
.fv,.snub,.mlem,.claw{display:none}
#mochi[data-mood="blissful"]:not(.ignoring) .fv[data-m="blissful"],
#mochi[data-mood="happy"]:not(.ignoring) .fv[data-m="happy"],
#mochi[data-mood="fine"]:not(.ignoring) .fv[data-m="fine"],
#mochi[data-mood="grumpy"]:not(.ignoring) .fv[data-m="grumpy"],
#mochi[data-mood="moody"]:not(.ignoring) .fv[data-m="moody"]{display:inline}
#mochi.ignoring .snub{display:inline}
#mochi.a-boop .mlem{display:inline}
#mochi.a-swipe .claw{display:inline}

#earL,#earR{transform-box:fill-box;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
#earL{transform-origin:85% 100%}
#earR{transform-origin:15% 100%}
#mochi[data-mood="blissful"] #earL{transform:rotate(5deg)}
#mochi[data-mood="blissful"] #earR{transform:rotate(-5deg)}
#mochi[data-mood="fine"] #earL{transform:rotate(-10deg)}
#mochi[data-mood="fine"] #earR{transform:rotate(10deg)}
#mochi[data-mood="grumpy"] #earL{transform:rotate(-30deg) translateY(3px)}
#mochi[data-mood="grumpy"] #earR{transform:rotate(30deg) translateY(3px)}
#mochi[data-mood="moody"] #earL{transform:rotate(-58deg) translateY(8px)}
#mochi[data-mood="moody"] #earR{transform:rotate(58deg) translateY(8px)}

.blush{transition:opacity .4s}
#mochi[data-mood="blissful"] .blush{opacity:1}
#mochi[data-mood="happy"] .blush{opacity:.75}
#mochi[data-mood="fine"] .blush{opacity:.35}
#mochi[data-mood="grumpy"] .blush{opacity:.12}
#mochi[data-mood="moody"] .blush{opacity:0}

.eyes{transform-box:fill-box;transform-origin:center;transition:transform .08s}
#mochi.blink .eyes{transform:scaleY(.12)}

/* parts */
#head{transform-box:fill-box;transform-origin:50% 90%;transition:transform .3s}
#mochi.ignoring #head{transform:rotate(-12deg) translateX(-4px)}
#nose{transform-box:fill-box;transform-origin:center}
#pawL,#pawR{transform-box:fill-box;transform-origin:50% 50%}
.beans{opacity:0;transition:opacity .2s}
#tail{transform-box:fill-box;transform-origin:0% 90%;animation:sway 3.2s ease-in-out infinite}
#mochi[data-mood="grumpy"] #tail,#mochi[data-mood="moody"] #tail{animation-duration:1s}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}

/* action animations */
#mochi.a-pat #head{animation:pat .6s ease-out}
@keyframes pat{0%,100%{transform:none}25%{transform:scale(1.06,.86) translateY(5px)}55%{transform:scale(.97,1.04)}}
#mochi.a-chin #head{animation:chin 1s ease-in-out}
@keyframes chin{0%,100%{transform:none}20%,80%{transform:rotate(-9deg) translateY(-3px)}50%{transform:rotate(-6deg) translateY(-4px)}}
#mochi.a-boop #nose{animation:boop .4s}
#mochi.a-boop #head{animation:boophead .4s}
@keyframes boop{40%{transform:scale(1.8)}}
@keyframes boophead{30%{transform:translateY(3px) scale(.97)}}
#mochi.a-beans #pawR{animation:beans 1.5s ease-in-out}
#mochi.a-beans .beans{opacity:1}
@keyframes beans{0%,100%{transform:none}20%,80%{transform:translate(-4px,-34px) rotate(-14deg) scale(2.1)}50%{transform:translate(-4px,-36px) rotate(-8deg) scale(2.15)}}
#mochi.a-swipe #pawL{animation:swipe .7s ease-out}
#mochi.a-swipe #cat{animation:lean .7s}
@keyframes swipe{0%{transform:none}15%{transform:translate(-18px,-60px) rotate(-50deg) scale(1.9)}30%{transform:translate(16px,-40px) rotate(30deg) scale(1.9)}60%{transform:translate(4px,-20px) scale(1.4)}100%{transform:none}}
@keyframes lean{20%{transform:rotate(-4deg) scale(1.03)}}
#mochi.a-pounce #cat{animation:pounce .8s cubic-bezier(.3,.7,.4,1)}
@keyframes pounce{0%{transform:none}22%{transform:scale(1.08,.82)}50%{transform:translate(18px,-46px) rotate(8deg) scale(.95,1.12)}78%{transform:translateY(0) scale(1.1,.86)}100%{transform:none}}
#mochi.a-nom #head{animation:nom .25s 4}
@keyframes nom{50%{transform:translateY(3px) scale(1.03,.95)}}
#mochi.a-up #cat{animation:up 1.4s ease-in-out}
@keyframes up{0%,100%{transform:none}25%,75%{transform:translateY(-30px) scale(.94,1.22)}}
#mochi.a-melt #cat{animation:melt 1.4s ease-in-out}
@keyframes melt{0%,100%{transform:none}25%{transform:translateY(-14px) scale(.95,1.1)}50%,75%{transform:translate(-14px,0) scale(1.35,.6) rotate(-4deg)}}
#mochi.a-tail #tail{animation:lash .14s ease-in-out 6 alternate}
@keyframes lash{from{transform:rotate(14deg)}to{transform:rotate(-22deg)}}
#mochi.a-wiggle #cat{animation:wig .9s}
@keyframes wig{20%{transform:rotate(-5deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}

/* props */
.bubble{position:absolute;top:-46px;left:50%;z-index:3;background:var(--cream);color:#2a1430;font-family:var(--f-cute);font-size:1.25rem;padding:6px 16px;border-radius:18px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-50%)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--cream);border-bottom:0}
.bubble.show{animation:bub 1.8s ease-out forwards}
@keyframes bub{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.06)}20%,80%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
.feather{position:absolute;left:66%;top:-58px;width:80px;height:100px;pointer-events:none;opacity:0;transform-origin:50% 0;z-index:2}
.feather svg,.treat svg{width:100%;height:100%;display:block}
.feather.tease{opacity:1;animation:dangle .35s ease-in-out infinite alternate}
@keyframes dangle{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.feather.fly{opacity:0;transform:translate(60px,-80px) rotate(40deg);transition:transform .5s ease-out,opacity .5s}
.treat{position:absolute;left:50%;top:50%;width:48px;height:30px;margin:-15px 0 0 -24px;pointer-events:none;opacity:0;z-index:2}
.treat.go{animation:toss .5s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes toss{0%{opacity:1;transform:translate(150px,170px) rotate(0) scale(1.3)}60%{opacity:1;transform:translate(40px,-30px) rotate(-200deg) scale(1.1)}100%{opacity:0;transform:translate(0,0) rotate(-340deg) scale(.4)}}
.heartpop{position:absolute;pointer-events:none;font-family:var(--f-cute);font-size:1.6rem;z-index:3;animation:rise 1.3s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-90px) scale(1.3)}}

/* claw marks (cartoon) */
.claws{position:fixed;inset:0;z-index:7;pointer-events:none;display:grid;place-items:center;animation:clawfade 1.4s ease-in forwards}
.claws svg{width:min(86vw,440px);height:min(86vw,440px);overflow:visible;transform:rotate(var(--rot,0deg))}
.claws .o,.claws .i{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .16s ease-out forwards}
.claws .o{stroke:var(--bubblegum);stroke-width:7}
.claws .i{stroke:#fff;stroke-width:2}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes clawfade{0%,55%{opacity:1}100%{opacity:0}}

.status{margin:0;text-align:center;font-size:1.3rem;line-height:1.35;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.status b{font-family:var(--f-cute);font-weight:400;color:var(--bubblegum);white-space:nowrap}

/* actions */
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:86px;padding:8px 4px;border:3px solid rgba(196,166,255,.35);border-radius:20px;background:rgba(196,166,255,.1);color:var(--cream);font-family:var(--f-cute);font-size:1.05rem;line-height:1.1;cursor:pointer;transition:transform .12s,background .12s}
.act .e{font-size:1.8rem;line-height:1}
.act:active{transform:scale(.95)}
.act:focus-visible{outline:3px solid var(--pumpkin);outline-offset:3px}
.act.treat{background:var(--pumpkin);border-color:#ffc27e;color:#3a1240}
.act.treat.beg{animation:beg 1s ease-in-out infinite}
@keyframes beg{50%{transform:scale(1.07);box-shadow:0 0 0 6px rgba(255,154,60,.35)}}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:rgba(196,166,255,.12);border:2px solid rgba(196,166,255,.35);border-radius:18px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--f-cute);font-weight:400;font-size:clamp(1.4rem,6.5vw,1.9rem);line-height:1.1;color:var(--pumpkin);font-variant-numeric:tabular-nums}
.stat span{font-size:1rem;color:var(--lilac)}

.controls{display:flex;justify-content:center}
.btn{font-family:var(--f-cute);font-size:1.1rem;border-radius:999px;padding:0 22px;min-height:48px;cursor:pointer;background:transparent;color:var(--lilac);border:2px solid rgba(196,166,255,.4)}
.btn:focus-visible{outline:3px solid var(--pumpkin);outline-offset:3px}
.foot{text-align:center;font-family:var(--f-cute);color:var(--lilac);font-size:1.1rem;margin:4px 0 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .claws .o,.claws .i{stroke-dashoffset:0}
  .bubble.show{opacity:1}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<div class="wrap" id="wrap">
  <nav aria-label="Pages">
    <a href="index.html">🎃 poster</a>
    <a href="rage.html">🔨 rage room</a>
    <a href="mochi.html" aria-current="page">🐾 mochi</a>
  </nav>

  <header>
    <p class="eyebrow">say hi to</p>
    <h1>MOCHI</h1>
    <p class="sub">one BIG tuxedo cat. even bigger opinions.</p>
  </header>

  <section class="meter" aria-label="Mochi's mood">
    <div class="meter-top"><span>Mochi's mood</span><b id="moodLabel" aria-live="polite"></b></div>
    <div class="chips" id="chips"></div>
    <div class="track" aria-hidden="true"><i id="moodDot"></i></div>
  </section>

  <section class="stage">
    <div class="rug" aria-hidden="true"></div>
    <div class="catbox" id="mochi" data-mood="happy">
      <div class="bubble" id="bubble" aria-hidden="true"></div>
      <div class="feather" id="feather" aria-hidden="true">
        <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M40 0 V56" stroke="#c4a6ff" stroke-width="2"/>
          <path d="M40 56 q-16 18 -6 42 q10 -6 14 -20 q4 -14 -8 -22z" fill="#ff9fd0"/>
          <path d="M42 56 q14 14 6 34 q-8 -4 -10 -16 q-2 -10 4 -18z" fill="#c4a6ff"/>
          <path d="M40 58 q-4 20 -6 40" stroke="#fff4ea" stroke-width="1.5" fill="none"/>
        </svg>
      </div>
      <div class="treat" id="treat" aria-hidden="true">
        <svg viewBox="0 0 48 30" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 15 q12 -14 28 0 q-16 14 -28 0z" fill="#ff9a3c" stroke="#a85a14" stroke-width="2"/>
          <path d="M33 15 l12 -9 v18z" fill="#ff9a3c" stroke="#a85a14" stroke-width="2" stroke-linejoin="round"/>
          <circle cx="13" cy="13" r="2" fill="#2a1430"/>
        </svg>
      </div>

      <svg id="cat" viewBox="2 0 156 158" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mochi, a tuxedo cat with a pink bow tie">
        <g id="tail"><path transform="translate(12 2)" d="M126 118 q30 -6 22 -40 q-4 -12 -10 -6 q6 22 -16 34z" fill="#1d1a24"/></g>
        <g id="body">
          <ellipse cx="80" cy="110" rx="62" ry="40" fill="#1d1a24"/>
          <path d="M56 94 q24 -10 48 0 l-5 50 h-38z" fill="#fbf7f2"/>
        </g>

        <g id="head">
          <g id="earL"><path d="M34 50 L40 10 L66 36z" fill="#1d1a24"/><path d="M42 40 L44 20 L58 35z" fill="#ff9fd0"/></g>
          <g id="earR"><path d="M126 50 L120 10 L94 36z" fill="#1d1a24"/><path d="M118 40 L116 20 L102 35z" fill="#ff9fd0"/></g>
          <ellipse cx="80" cy="61" rx="52" ry="41" fill="#1d1a24"/>
          <path d="M80 40 q-6 18 -26 30 q-6 16 26 26 q32 -10 26 -26 q-20 -12 -26 -30z" fill="#fbf7f2"/>
          <ellipse class="blush" cx="54" cy="74" rx="8" ry="4.5" fill="#ff78aa"/>
          <ellipse class="blush" cx="106" cy="74" rx="8" ry="4.5" fill="#ff78aa"/>

          <!-- blissful -->
          <g class="fv" data-m="blissful">
            <g class="eyes" stroke="#fbf7f2" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M51 60 q9 -10 18 0"/><path d="M91 60 q9 -10 18 0"/></g>
            <g fill="#ffd54a"><path d="M38 36 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2z"/><path d="M121 32 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5z"/></g>
            <path d="M80 76 q-4 6 -9 3 M80 76 q4 6 9 3" stroke="#14101a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <path d="M75 81 q5 8 10 0z" fill="#ff7aa8" stroke="#14101a" stroke-width="1.5" stroke-linejoin="round"/>
          </g>
          <!-- happy -->
          <g class="fv" data-m="happy">
            <g class="eyes">
              <ellipse cx="60" cy="58" rx="9.5" ry="10.5" fill="#9be07a"/><ellipse cx="60" cy="59" rx="5.5" ry="7.5" fill="#14101a"/>
              <ellipse cx="100" cy="58" rx="9.5" ry="10.5" fill="#9be07a"/><ellipse cx="100" cy="59" rx="5.5" ry="7.5" fill="#14101a"/>
              <circle cx="57" cy="54" r="2.6" fill="#fff"/><circle cx="97" cy="54" r="2.6" fill="#fff"/>
              <circle cx="63" cy="62" r="1.2" fill="#fff"/><circle cx="103" cy="62" r="1.2" fill="#fff"/>
            </g>
            <path d="M80 76 q-4 6 -9 3 M80 76 q4 6 9 3" stroke="#14101a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          </g>
          <!-- fine I guess -->
          <g class="fv" data-m="fine">
            <g class="eyes">
              <path d="M50.5 56 h19 q-1 11 -9.5 11 q-8.5 0 -9.5 -11z" fill="#9be07a"/><ellipse cx="60" cy="60.5" rx="2.4" ry="4.5" fill="#14101a"/>
              <path d="M90.5 56 h19 q-1 11 -9.5 11 q-8.5 0 -9.5 -11z" fill="#9be07a"/><ellipse cx="100" cy="60.5" rx="2.4" ry="4.5" fill="#14101a"/>
            </g>
            <g stroke="#cfc8d8" stroke-width="2" stroke-linecap="round"><path d="M50 55 h20"/><path d="M90 55 h20"/></g>
            <path d="M74 80 h12" stroke="#14101a" stroke-width="2.2" stroke-linecap="round"/>
          </g>
          <!-- grumpy -->
          <g class="fv" data-m="grumpy">
            <g class="eyes">
              <path d="M50.5 52 L69.5 57.5 q-2 9 -9.5 9 q-8 0 -9.5 -9.5z" fill="#9be07a"/><ellipse cx="60" cy="60.5" rx="2.2" ry="4.2" fill="#14101a"/>
              <path d="M109.5 52 L90.5 57.5 q2 9 9.5 9 q8 0 9.5 -9.5z" fill="#9be07a"/><ellipse cx="100" cy="60.5" rx="2.2" ry="4.2" fill="#14101a"/>
            </g>
            <g stroke="#cfc8d8" stroke-width="2.4" stroke-linecap="round"><path d="M49 51 L71 57.5"/><path d="M111 51 L89 57.5"/></g>
            <path d="M73 83 q7 -6 14 0" stroke="#14101a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          </g>
          <!-- moody -->
          <g class="fv" data-m="moody">
            <g class="eyes">
              <path d="M50.5 54 L69.5 60 q-3 5 -9.5 5 q-7 0 -9.5 -6z" fill="#9be07a"/><ellipse cx="60" cy="61.5" rx="1.8" ry="3" fill="#14101a"/>
              <path d="M109.5 54 L90.5 60 q3 5 9.5 5 q7 0 9.5 -6z" fill="#9be07a"/><ellipse cx="100" cy="61.5" rx="1.8" ry="3" fill="#14101a"/>
            </g>
            <g stroke="#cfc8d8" stroke-width="3.2" stroke-linecap="round"><path d="M46 47 L70 55"/><path d="M114 47 L90 55"/></g>
            <g stroke="#ff3b6b" stroke-width="2.6" stroke-linecap="round" fill="none" transform="translate(14 -8)">
              <path d="M118 26 q4 4 0 8"/><path d="M130 26 q-4 4 0 8"/><path d="M120 22 q4 4 8 0"/><path d="M120 38 q4 -4 8 0"/>
            </g>
            <path d="M72 84 q8 -7 16 0" stroke="#14101a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <path d="M75.6 82.2 l1.8 3.6 l1.8 -3.9z" fill="#fff"/>
          </g>
          <!-- ignoring you -->
          <g class="snub">
            <g class="eyes" stroke="#cfc8d8" stroke-width="3" fill="none" stroke-linecap="round"><path d="M51 58 q9 5 18 0"/><path d="M91 58 q9 5 18 0"/></g>
            <path d="M75 82 q5 -3 10 0" stroke="#14101a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          </g>

          <path id="nose" d="M75 70 h10 l-5 6z" fill="#ff7aa8"/>
          <path class="mlem" d="M77.5 80 q2.5 9 5 0z" fill="#ff7aa8" stroke="#14101a" stroke-width="1"/>
          <g stroke="#cfc8d8" stroke-width="1.6" stroke-linecap="round">
            <path d="M44 72 h-20 M44 77 l-18 4"/><path d="M116 72 h20 M116 77 l18 4"/>
          </g>
        </g>

        <g id="bow"><path d="M68 96 l12 6 l12 -6 l-2 10 l-10 -4 l-10 4z" fill="#ff6fae"/><circle cx="80" cy="102" r="3.5" fill="#d9468a"/></g>

        <g id="pawL">
          <ellipse cx="54" cy="142" rx="15" ry="8.5" fill="#fbf7f2" stroke="#e2d6ec" stroke-width="1.2"/>
          <g class="claw" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"><path d="M46 135 l-1.5 -4"/><path d="M54 134 v-4.5"/><path d="M62 135 l1.5 -4"/></g>
        </g>
        <g id="pawR">
          <ellipse cx="106" cy="142" rx="15" ry="8.5" fill="#fbf7f2" stroke="#e2d6ec" stroke-width="1.2"/>
          <g class="beans" fill="#ff9fd0"><ellipse cx="106" cy="144.5" rx="5.5" ry="3.6"/><circle cx="99" cy="139" r="2.4"/><circle cx="106" cy="137.2" r="2.4"/><circle cx="113" cy="139" r="2.4"/></g>
        </g>
      </svg>
    </div>
  </section>

  <p class="status" id="status" aria-live="polite">Mochi is here. Go on, say hi.</p>

  <div class="actions" id="actions">
    <button class="act" type="button" data-a="pats"><span class="e" aria-hidden="true">🤚</span>Head pats</button>
    <button class="act" type="button" data-a="chin"><span class="e" aria-hidden="true">☝️</span>Chin scratches</button>
    <button class="act" type="button" data-a="belly"><span class="e" aria-hidden="true">🫳</span>Belly rub</button>
    <button class="act" type="button" data-a="boop"><span class="e" aria-hidden="true">👉</span>Boop the nose</button>
    <button class="act" type="button" data-a="beans"><span class="e" aria-hidden="true">🐾</span>Toe beans</button>
    <button class="act" type="button" data-a="feather"><span class="e" aria-hidden="true">🪶</span>Feather toy</button>
    <button class="act treat" type="button" data-a="treat" id="treatBtn"><span class="e" aria-hidden="true">🐟</span>Give a treat</button>
    <button class="act" type="button" data-a="pickup"><span class="e" aria-hidden="true">🤲</span>Pick him up</button>
    <button class="act" type="button" data-a="tail"><span class="e" aria-hidden="true">〰️</span>Touch the tail</button>
  </div>

  <section class="board" aria-label="Scores">
    <div class="stat"><b id="sLove">0</b><span>love points 💗</span></div>
    <div class="stat"><b id="sSwipes">0</b><span>swipes taken</span></div>
    <div class="stat"><b id="sTreats">0</b><span>treats given</span></div>
  </section>

  <div class="controls"><button class="btn" id="reset" type="button">reset scores</button></div>
  <p class="foot">happy halloween from mochi 🎃🐾</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- background: stars + floating hearts ----------
  const sky = $('sky'), sctx = sky.getContext('2d');
  let SW, SH;
  const ssize = () => { SW = sky.width = innerWidth; SH = sky.height = innerHeight; };
  ssize(); addEventListener('resize', ssize);
  const bgHearts = Array.from({ length: 22 }, () => ({ x: rnd(0, innerWidth), y: rnd(0, innerHeight), s: rnd(5, 11), v: rnd(.2, .6), c: Math.random() < .5 ? '#ff9fd0' : '#c4a6ff' }));
  const bgStars = Array.from({ length: 55 }, () => ({ x: rnd(0, innerWidth), y: rnd(0, innerHeight), r: rnd(.5, 1.7), p: rnd(0, 6) }));
  const drawHeart = h => {
    sctx.save(); sctx.translate(h.x, h.y); sctx.scale(h.s / 10, h.s / 10);
    sctx.fillStyle = h.c; sctx.globalAlpha = .55;
    sctx.beginPath(); sctx.moveTo(0, 3);
    sctx.bezierCurveTo(-10, -5, -5, -12, 0, -6);
    sctx.bezierCurveTo(5, -12, 10, -5, 0, 3);
    sctx.fill(); sctx.restore();
  };
  const skyFrame = t => {
    sctx.clearRect(0, 0, SW, SH);
    bgStars.forEach(s => {
      sctx.globalAlpha = .4 + .4 * Math.sin(t / 900 + s.p);
      sctx.fillStyle = '#fff4ea'; sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 7); sctx.fill();
    });
    sctx.globalAlpha = 1;
    bgHearts.forEach(h => { drawHeart(h); if (!reduce) { h.y -= h.v; if (h.y < -15) { h.y = SH + 15; h.x = rnd(0, SW); } } });
    if (!reduce) requestAnimationFrame(skyFrame);
  };
  requestAnimationFrame(skyFrame);

  // ---------- state ----------
  const KEY = 'lexi-mochi';
  const saved = store.get(KEY, {}) || {};
  const state = {
    mood: typeof saved.mood === 'number' ? saved.mood : 62,
    love: saved.love || 0,
    swipes: saved.swipes || 0,
    treats: saved.treats || 0
  };
  const save = () => store.set(KEY, state);

  const MOODS = [
    { k: 'blissful', label: 'Blissful', emoji: '😻', min: 85 },
    { k: 'happy', label: 'Happy', emoji: '😺', min: 65 },
    { k: 'fine', label: 'Fine I guess', emoji: '😑', min: 42 },
    { k: 'grumpy', label: 'Grumpy', emoji: '😾', min: 20 },
    { k: 'moody', label: 'Moody', emoji: '🌩️', min: -1 }
  ];
  const moodOf = v => MOODS.find(m => v >= m.min);

  const mochi = $('mochi'), chips = $('chips'), treatBtn = $('treatBtn');
  chips.innerHTML = MOODS.map(m => `<div class="chip" data-k="${m.k}"><span class="e" aria-hidden="true">${m.emoji}</span>${m.label}</div>`).join('');

  const render = () => {
    const m = moodOf(state.mood);
    mochi.dataset.mood = m.k;
    chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.k === m.k));
    $('moodLabel').textContent = `${m.label} ${m.emoji}`;
    $('moodDot').style.left = (100 - state.mood) + '%';
    $('sLove').textContent = state.love.toLocaleString();
    $('sSwipes').textContent = state.swipes.toLocaleString();
    $('sTreats').textContent = state.treats.toLocaleString();
    treatBtn.classList.toggle('beg', m.k === 'moody');
  };
  const setMood = v => {
    const before = moodOf(state.mood).k;
    state.mood = Math.max(0, Math.min(100, Math.round(v)));
    return { before, after: moodOf(state.mood).k };
  };

  // ---------- effects ----------
  let animTimer, ignTimer;
  const anim = (cls, ms) => {
    [...mochi.classList].filter(c => c.startsWith('a-')).forEach(c => mochi.classList.remove(c));
    void mochi.offsetWidth;
    mochi.classList.add('a-' + cls);
    clearTimeout(animTimer);
    animTimer = setTimeout(() => mochi.classList.remove('a-' + cls), ms);
  };
  const bubbleEl = $('bubble');
  const bubble = text => { bubbleEl.textContent = text; bubbleEl.classList.remove('show'); void bubbleEl.offsetWidth; bubbleEl.classList.add('show'); };
  const statusEl = $('status');
  const setStatus = html => { statusEl.innerHTML = html; };
  const hearts = n => {
    for (let i = 0; i < n; i++) {
      const h = document.createElement('span');
      h.className = 'heartpop';
      h.textContent = Math.random() < .25 ? '✦' : '♥';
      h.style.color = pick(['#ff9fd0', '#c4a6ff', '#ff9a3c']);
      h.style.left = rnd(20, 80) + '%';
      h.style.top = rnd(10, 45) + '%';
      h.style.animationDelay = (i * .08) + 's';
      mochi.appendChild(h);
      setTimeout(() => h.remove(), 1400 + i * 80);
    }
  };
  const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
  const claws = () => {
    const el = document.createElement('div');
    el.className = 'claws';
    el.style.setProperty('--rot', rnd(-25, 25).toFixed(0) + 'deg');
    let paths = '';
    for (let i = 0; i < 3; i++) {
      const d = `M${20 + i * 18} ${10 + i * 4} Q${46 + i * 18} 48 ${34 + i * 18} ${90 - i * 4}`;
      const delay = `style="animation-delay:${(i * .06).toFixed(2)}s"`;
      paths += `<path class="o" pathLength="1" d="${d}" ${delay}/><path class="i" pathLength="1" d="${d}" ${delay}/>`;
    }
    el.innerHTML = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${paths}</svg>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1450);
    const w = $('wrap'); w.classList.remove('jolt'); void w.offsetWidth; w.classList.add('jolt');
  };

  const moodyNote = (before, after) => (after === 'moody' && before !== 'moody') ? " Uh oh, he's Moody now. Only a treat will fix this." : '';

  const good = (dm, dl, say, an, ms, line) => {
    setMood(state.mood + dm);
    state.love += dl;
    anim(an, ms); bubble(say);
    hearts(Math.min(6, 2 + Math.round(dl / 3)));
    setStatus(`${line} <b>+${dl} 💗</b>`);
  };
  const bad = (dm, an, ms, line, say) => {
    const { before, after } = setMood(state.mood + dm);
    anim(an, ms); bubble(say);
    setStatus(line + moodyNote(before, after));
  };
  const swipe = (dm, line, say) => {
    state.swipes++;
    bad(dm, 'swipe', 700, line, say);
    claws();
    buzz([30, 40, 30]);
  };

  // ---------- actions ----------
  let busy = false;
  const feather = $('feather'), treatEl = $('treat');

  const ACTIONS = {
    pats() {
      good(8, 5, 'purr~', 'pat', 650, pick(['Pat pat pat. Approved.', 'He leans into your hand. Purr motor: ON.', 'Big boy, enormous purrs.']));
    },
    chin() {
      good(10, 6, 'prrrrrr', 'chin', 1000, pick(['Chin scratches: elite tier.', 'His eyes go all slow-blinky.', 'He tilts his head for the good spot.']));
    },
    belly() {
      const k = moodOf(state.mood).k;
      const trap = k === 'blissful' ? .5 : (k === 'grumpy' ? 1 : .75);
      if (Math.random() < trap) {
        swipe(-22, pick(['IT WAS A TRAP. Bunny kicks + swipe.', 'He grabbed your hand and kicked it. Classic.', 'Belly rubs are a privilege, not a right.']), pick(['HISS!', 'mrrAOW!!', 'NOPE']));
      } else {
        good(14, 10, '...ok fine', 'wiggle', 900, 'He allowed it. Just this once. Tell no one.');
      }
    },
    boop() {
      good(5, 3, 'boop?!', 'boop', 800, pick(['Boop! Mlem deployed.', 'Nose: booped. Dignity: slightly dented.', 'He looks offended but secretly loved it.']));
    },
    beans() {
      good(7, 5, 'beans!!', 'beans', 1500, pick(['TOE BEANS. Pink. Squishy. Perfect.', 'He lets you hold one paw. Huge honor.', 'Bean inspection complete: 10/10.']));
    },
    feather() {
      busy = true;
      feather.className = 'feather tease';
      bubble('!!');
      setStatus('He spots the feather. Butt wiggle engaged...');
      setTimeout(() => {
        feather.className = 'feather fly';
        good(12, 8, '*pounce*', 'pounce', 800, pick(['POUNCE! The feather never stood a chance.', 'Mighty hunter, defeater of feathers.', 'He caught it and is very proud of himself.']));
        save(); render();
        setTimeout(() => { feather.className = 'feather'; busy = false; }, 600);
      }, reduce ? 200 : 900);
    },
    treat() {
      busy = true;
      treatEl.classList.remove('go'); void treatEl.offsetWidth; treatEl.classList.add('go');
      setTimeout(() => {
        const { before } = setMood(100);
        state.treats++; state.love += 4;
        mochi.classList.remove('ignoring');
        anim('nom', 1000); bubble('nom nom nom'); hearts(5);
        setStatus((before === 'moody' ? 'Treat accepted. All is forgiven. ' : '') +
          pick(['Mood: fully restored.', 'Tiny crunchy happiness delivered.', 'He now loves you the most (for 5 minutes).']) + ' <b>+4 💗</b>');
        save(); render();
        busy = false;
      }, reduce ? 50 : 480);
    },
    pickup() {
      if (state.mood >= 65) good(6, 5, 'i am loaf', 'up', 1400, pick(['Carried like a precious, very heavy loaf.', 'Oof. He is HEAVY. Purring loudly though.']));
      else bad(-8, 'melt', 1400, 'He turned into liquid and slid right out of your arms.', 'nuh uh');
    },
    tail() {
      bad(-9, 'tail', 900, pick(['The tail is NOT for touching.', 'Tail lash! He glares over his shoulder.', 'Hands off the tail, peasant.']), 'HEY!');
    }
  };

  const ignore = () => {
    mochi.classList.add('ignoring');
    bubble('…');
    setStatus(pick(['Mochi is ignoring you. A treat might change his mind.', 'He turned away. Rude, but valid. Try a treat.', 'Left on read by a cat. Treats fix this.']));
    clearTimeout(ignTimer);
    ignTimer = setTimeout(() => mochi.classList.remove('ignoring'), 1600);
  };

  $('actions').addEventListener('click', e => {
    const b = e.target.closest('.act'); if (!b || busy) return;
    const key = b.dataset.a;
    if (key !== 'treat' && moodOf(state.mood).k === 'moody') { ignore(); return; }
    ACTIONS[key]();
    save(); render();
  });

  $('reset').addEventListener('click', () => {
    if (!confirm('Reset love points, swipes and treats?')) return;
    state.love = 0; state.swipes = 0; state.treats = 0; state.mood = 62;
    save(); render();
    setStatus('Fresh start. Mochi has forgotten everything (he says).');
  });

  // ---------- idle life ----------
  if (!reduce) {
    const blink = () => {
      mochi.classList.add('blink');
      setTimeout(() => mochi.classList.remove('blink'), 140);
      setTimeout(blink, rnd(2500, 5500));
    };
    setTimeout(blink, 2000);
  }
  // mood slowly drifts down toward "Fine I guess" if left alone
  setInterval(() => {
    if (state.mood > 45) { setMood(state.mood - 2); save(); render(); }
  }, 15000);

  render();
})();
</script>
</body>
</html>
