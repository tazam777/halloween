<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi's Rage Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Chewy&family=Patrick+Hand&display=swap">
<style>
:root{
  --night:#1a1030;--night-2:#2a1a48;--blood:#ff3b6b;--pumpkin:#ff9a3c;--bubblegum:#ff9fd0;--lilac:#c4a6ff;--cream:#fff4ea;
  --f-display:"Creepster","Impact",sans-serif;
  --f-cute:"Chewy","Comic Sans MS","Trebuchet MS",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS","Trebuchet MS",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:radial-gradient(ellipse at 70% 0%,#4a2a78 0%,var(--night) 65%) fixed,var(--night);
  color:var(--cream);font-family:var(--f-hand);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}
#fx{z-index:6}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
nav a{font-family:var(--f-cute);font-size:1.05rem;color:var(--lilac);text-decoration:none;background:rgba(196,166,255,.14);border-radius:999px;padding:0 16px;min-height:44px;display:inline-flex;align-items:center}
nav a[aria-current="page"]{background:var(--bubblegum);color:#3a1240}

header{text-align:center}
.eyebrow{margin:0;font-family:var(--f-cute);font-size:1.2rem;letter-spacing:.08em;color:var(--bubblegum)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.8rem,13vw,4.4rem);line-height:1.02;letter-spacing:.03em;color:var(--blood);text-shadow:0 0 18px rgba(255,59,107,.45),3px 3px 0 var(--night)}
.sub{margin:6px 0 0;font-size:1.2rem}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:rgba(196,166,255,.12);border:2px solid rgba(196,166,255,.35);border-radius:18px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--f-cute);font-weight:400;font-size:clamp(1.4rem,6.5vw,1.9rem);line-height:1.1;color:var(--pumpkin);font-variant-numeric:tabular-nums}
.stat span{font-size:1rem;color:var(--lilac)}

.stage{
  position:relative;height:clamp(300px,82vw,390px);border-radius:26px;overflow:hidden;
  border:3px solid var(--bubblegum);box-shadow:0 0 0 6px var(--night),0 0 0 9px var(--lilac);
  background:linear-gradient(180deg,#2c1b4e,#3d2569);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 46px);pointer-events:none}
.stage.quake{animation:quake .32s}
@keyframes quake{0%,100%{transform:none}25%{transform:translate(-6px,4px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,2px)}}
.sign{position:absolute;top:14px;left:14px;z-index:1;font-family:var(--f-display);font-size:1.15rem;color:var(--pumpkin);border:2px dashed var(--pumpkin);border-radius:10px;padding:2px 10px;transform:rotate(-4deg);background:rgba(26,16,48,.5);pointer-events:none}
.table{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#a070b8 0 10px,#6a4282 10px,#4e2f62 100%);border-top:3px solid #c493da;pointer-events:none}

#target{position:absolute;left:0;right:0;bottom:17%;margin:0 auto;width:min(84%,360px);aspect-ratio:200/160;cursor:pointer;outline:none;border-radius:20px;z-index:2}
#target:focus-visible{outline:3px dashed var(--pumpkin);outline-offset:4px}
.obj{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 100%}
#target.enter .obj{animation:enter .55s cubic-bezier(.2,.9,.3,1.25) both}
#target.shake .obj{animation:shake .28s ease-out}
#target.gone .obj{opacity:0;animation:vanish .16s ease-in}
@keyframes enter{from{transform:translateX(140%) rotate(10deg)}to{transform:none}}
@keyframes shake{0%{transform:none}20%{transform:translate(-7px,1px) rotate(-3deg)}40%{transform:translate(6px,-2px) rotate(3deg) scale(1.02,.97)}60%{transform:translate(-4px,0) rotate(-1.5deg)}80%{transform:translate(3px,0) rotate(1deg)}100%{transform:none}}
@keyframes vanish{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.25,.6)}}

.hp{position:absolute;left:50%;bottom:calc(4% + 30px);width:min(60%,220px);height:12px;transform:translateX(-50%);background:rgba(26,16,48,.6);border-radius:99px;overflow:hidden;border:2px solid rgba(255,244,234,.25);pointer-events:none}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--blood),var(--pumpkin));border-radius:99px;transition:width .2s}
.objname{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-family:var(--f-cute);font-size:1.15rem;pointer-events:none}

.combo{position:absolute;top:12px;right:12px;z-index:3;background:rgba(26,16,48,.78);border:2px solid var(--pumpkin);border-radius:14px;padding:4px 10px 8px;font-family:var(--f-cute);color:var(--pumpkin);font-size:1.05rem;min-width:116px;text-align:center;pointer-events:none}
.combo i{display:block;height:5px;margin-top:4px;border-radius:9px;background:var(--pumpkin);transform-origin:left}
.combo i.run{animation:drain var(--ms,1000ms) linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.word,.plus{position:absolute;z-index:4;pointer-events:none;white-space:nowrap;font-family:var(--f-cute);transform:translate(-50%,-50%);animation:word .75s ease-out forwards}
.word{font-size:2.1rem;color:var(--pumpkin);text-shadow:3px 3px 0 #3a1240,-2px -2px 0 #3a1240,2px -2px 0 #3a1240,-2px 2px 0 #3a1240}
.word.big{font-size:2.5rem;color:var(--bubblegum)}
.plus{font-size:2.3rem;color:var(--bubblegum);text-shadow:3px 3px 0 #7a2a5a,-2px -2px 0 #7a2a5a;animation-duration:1.1s}
@keyframes word{0%{transform:translate(-50%,-50%) scale(.4) rotate(var(--r,0deg));opacity:1}30%{transform:translate(-50%,-85%) scale(1.15) rotate(var(--r,0deg));opacity:1}100%{transform:translate(-50%,-160%) scale(1) rotate(var(--r,0deg));opacity:0}}

.swing{position:absolute;z-index:5;width:90px;height:90px;margin:-22px 0 0 -22px;pointer-events:none;transform-origin:82% 82%;animation:swing .26s ease-in forwards}
.swing svg{width:100%;height:100%;display:block}
@keyframes swing{0%{transform:rotate(-60deg);opacity:1}65%{transform:rotate(8deg);opacity:1}100%{transform:rotate(4deg);opacity:0}}

.msg{margin:0;text-align:center;font-family:var(--f-cute);font-size:clamp(1.3rem,5.5vw,1.7rem);color:var(--bubblegum);min-height:2.4em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
.msg.pop{animation:msg .5s ease-out}
@keyframes msg{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

.tools-label{margin:0 0 -6px;text-align:center;font-size:1.15rem;color:var(--lilac)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.tools{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:100px;padding:8px 6px;border-radius:20px;border:3px solid rgba(196,166,255,.35);background:rgba(196,166,255,.1);color:var(--cream);font-family:var(--f-cute);font-size:1.1rem;cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
.tool svg{width:52px;height:52px}
.tool small{font-family:var(--f-hand);font-size:.95rem;color:var(--lilac);letter-spacing:.12em}
.tool[aria-pressed="true"]{background:rgba(255,159,208,.22);border-color:var(--bubblegum);transform:translateY(-2px);box-shadow:0 5px 0 #c75b9a}
.tool:focus-visible{outline:3px solid var(--pumpkin);outline-offset:3px}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--f-cute);font-size:1.15rem;border:0;border-radius:999px;padding:0 22px;min-height:52px;cursor:pointer;background:var(--cream);color:#2a1430;box-shadow:0 5px 0 var(--lilac);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lilac)}
.btn.ghost{background:transparent;color:var(--lilac);box-shadow:none;border:2px solid rgba(196,166,255,.4)}
.btn:focus-visible{outline:3px solid var(--pumpkin);outline-offset:3px}
.foot{text-align:center;font-family:var(--f-cute);color:var(--lilac);font-size:1.1rem;margin:4px 0 0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <nav aria-label="Pages">
    <a href="index.html">🎃 poster</a>
    <a href="rage.html" aria-current="page">🔨 rage room</a>
    <a href="mochi.html">🐾 mochi</a>
  </nav>

  <header>
    <p class="eyebrow">lexi's very own</p>
    <h1>RAGE ROOM</h1>
    <p class="sub">pick a tool. tap the thing. let it out.</p>
  </header>

  <section class="board" aria-label="Scoreboard">
    <div class="stat"><b id="sPoints">0</b><span>points</span></div>
    <div class="stat"><b id="sSmashed">0</b><span>smashed</span></div>
    <div class="stat"><b id="sBest">0</b><span>best combo</span></div>
  </section>

  <section class="stage" id="stage">
    <div class="sign" aria-hidden="true">SMASH ZONE</div>
    <div class="combo" id="combo" hidden><span id="comboTxt"></span><i id="comboBar"></i></div>
    <div class="table" aria-hidden="true"></div>
    <div id="target" role="button" tabindex="0" aria-label="Smash it"></div>
    <div class="hp" aria-hidden="true"><i id="hpFill"></i></div>
    <div class="objname" id="objname"></div>
  </section>

  <p class="msg" id="msg" aria-live="polite">Pick a tool. Tap to smash. Breathe.</p>

  <p class="tools-label">choose your weapon</p>
  <div class="tools" id="tools"></div>

  <div class="controls">
    <button class="btn" id="mute" type="button"></button>
    <button class="btn ghost" id="reset" type="button">reset scores</button>
  </div>

  <p class="foot">no feelings were harmed. only printers. 🖨️💥</p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- saved state ----------
  const KEY = 'lexi-rage-room';
  const saved = store.get(KEY, {}) || {};
  const state = {
    points: saved.points || 0,
    smashed: saved.smashed || 0,
    best: saved.best || 0,
    muted: !!saved.muted,
    tool: saved.tool || 'bat'
  };
  const save = () => store.set(KEY, state);

  // ---------- background: stars + floating hearts ----------
  const sky = $('sky'), sctx = sky.getContext('2d');
  let SW, SH;
  const ssize = () => { SW = sky.width = innerWidth; SH = sky.height = innerHeight; };
  ssize(); addEventListener('resize', ssize);
  const bgHearts = Array.from({ length: 22 }, () => ({ x: rnd(0, innerWidth), y: rnd(0, innerHeight), s: rnd(5, 11), v: rnd(.2, .6), c: Math.random() < .5 ? '#ff9fd0' : '#c4a6ff' }));
  const bgStars = Array.from({ length: 55 }, () => ({ x: rnd(0, innerWidth), y: rnd(0, innerHeight), r: rnd(.5, 1.7), p: rnd(0, 6) }));
  const drawHeart = h => {
    sctx.save(); sctx.translate(h.x, h.y); sctx.scale(h.s / 10, h.s / 10);
    sctx.fillStyle = h.c; sctx.globalAlpha = .55;
    sctx.beginPath(); sctx.moveTo(0, 3);
    sctx.bezierCurveTo(-10, -5, -5, -12, 0, -6);
    sctx.bezierCurveTo(5, -12, 10, -5, 0, 3);
    sctx.fill(); sctx.restore();
  };
  const skyFrame = t => {
    sctx.clearRect(0, 0, SW, SH);
    bgStars.forEach(s => {
      sctx.globalAlpha = .4 + .4 * Math.sin(t / 900 + s.p);
      sctx.fillStyle = '#fff4ea'; sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 7); sctx.fill();
    });
    sctx.globalAlpha = 1;
    bgHearts.forEach(h => { drawHeart(h); if (!reduce) { h.y -= h.v; if (h.y < -15) { h.y = SH + 15; h.x = rnd(0, SW); } } });
    if (!reduce) requestAnimationFrame(skyFrame);
  };
  requestAnimationFrame(skyFrame);

  // ---------- tools ----------
  const TOOLS = {
    bat: {
      name: 'Bat', dmg: 2, dots: 2, cracks: 1, words: ['WHACK!', 'THWACK!', 'POW!'], pitch: 190, noiseF: 1500,
      svg: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-45 32 32)"><path d="M27 6 Q32 1 37 6 Q39 24 35 44 L29 44 Q25 24 27 6Z" fill="#e8b47c" stroke="#7a4a2a" stroke-width="2"/><rect x="29" y="43" width="6" height="16" rx="2" fill="#ff9fd0"/><ellipse cx="32" cy="60" rx="5" ry="2.5" fill="#7a4a2a"/></g></svg>`
    },
    hammer: {
      name: 'Hammer', dmg: 2, dots: 2, cracks: 1.6, words: ['BAM!', 'WHAM!', 'KRAK!'], pitch: 280, noiseF: 2600,
      svg: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-45 32 32)"><rect x="29" y="16" width="6" height="44" rx="3" fill="#c88a52" stroke="#6b3f1e" stroke-width="2"/><rect x="28" y="44" width="8" height="14" rx="3" fill="#ff9fd0"/><rect x="14" y="6" width="36" height="14" rx="3" fill="#aab3c8" stroke="#4d5468" stroke-width="2"/></g></svg>`
    },
    pan: {
      name: 'Frying pan', dmg: 1, dots: 1, cracks: .8, words: ['BONK!', 'BOING!', 'CLANG!', 'DONK!'], pitch: 520, noiseF: 3200, ring: true,
      svg: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-45 32 32)"><rect x="29" y="38" width="6" height="22" rx="3" fill="#ff9fd0" stroke="#c75b9a" stroke-width="2"/><circle cx="32" cy="22" r="18" fill="#3a3348" stroke="#1e1a28" stroke-width="2"/><circle cx="32" cy="22" r="13" fill="#5a4e70"/><path d="M25 18 q4 -8 11 -3 q8 2 3 9 q-3 7 -10 4 q-8 -2 -4 -10z" fill="#fff"/><circle cx="32" cy="21" r="3.8" fill="#ffc83d"/></g></svg>`
    },
    sledge: {
      name: 'Sledgehammer', dmg: 4, dots: 4, cracks: 1.4, words: ['KABOOM!', 'KRAKOOM!', 'SMAAASH!'], pitch: 95, noiseF: 700, quake: true,
      svg: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-45 32 32)"><rect x="29" y="18" width="6" height="44" rx="3" fill="#c88a52" stroke="#6b3f1e" stroke-width="2"/><rect x="28" y="46" width="8" height="14" rx="3" fill="#ff9fd0"/><rect x="8" y="4" width="48" height="18" rx="5" fill="#7d869c" stroke="#3e4456" stroke-width="2"/><rect x="14" y="4" width="4" height="18" fill="#c4a6ff"/><rect x="46" y="4" width="4" height="18" fill="#c4a6ff"/></g></svg>`
    }
  };
  if (!TOOLS[state.tool]) state.tool = 'bat';

  const toolsEl = $('tools');
  toolsEl.innerHTML = Object.entries(TOOLS).map(([k, t]) =>
    `<button class="tool" type="button" data-tool="${k}" aria-pressed="${k === state.tool}">${t.svg}<span>${t.name}</span><small aria-label="power ${t.dots} of 4">${'●'.repeat(t.dots)}${'○'.repeat(4 - t.dots)}</small></button>`
  ).join('');
  toolsEl.addEventListener('click', e => {
    const b = e.target.closest('.tool'); if (!b) return;
    state.tool = b.dataset.tool; save();
    toolsEl.querySelectorAll('.tool').forEach(x => x.setAttribute('aria-pressed', x === b));
  });

  // ---------- objects ----------
  const keyboardKeys = (() => {
    let s = '';
    for (let r = 0; r < 3; r++) for (let c = 0; c < 12; c++) {
      const pinkKey = (r === 0 && c === 0) || (r === 1 && c === 11);
      s += `<rect x="${(19 + c * 13.8).toFixed(1)}" y="${88 + r * 13}" width="11" height="10" rx="2.5" fill="${pinkKey ? '#ff9fd0' : '#c4a6ff'}"/>`;
    }
    s += `<rect x="19" y="127" width="25" height="10" rx="2.5" fill="#c4a6ff"/><rect x="47" y="127" width="106" height="10" rx="2.5" fill="#fff4ea"/><rect x="156" y="127" width="25" height="10" rx="2.5" fill="#ff9a3c"/>`;
    return s;
  })();
  const TXT = 'font-family="Patrick Hand, Comic Sans MS, sans-serif" text-anchor="middle"';

  const OBJECTS = [
    {
      id: 'laptop', name: 'a laptop', hp: 7, value: 120, colors: ['#3d3654', '#6fd3ff', '#b9b3c9', '#ff9fd0'],
      quip: 'No more 47 unread emails.',
      svg: `<rect x="40" y="38" width="120" height="100" rx="9" fill="#3d3654"/>
        <rect x="48" y="46" width="104" height="84" rx="4" fill="#6fd3ff"/>
        <rect x="60" y="62" width="80" height="50" rx="6" fill="#fff4ea"/>
        <rect x="60" y="62" width="80" height="12" rx="6" fill="#ff9fd0"/>
        <circle cx="67" cy="68" r="2.4" fill="#ff3b6b"/>
        <text x="100" y="91" ${TXT} font-size="11" fill="#2a1430">47 unread emails</text>
        <rect x="82" y="98" width="36" height="9" rx="4.5" fill="#c4a6ff"/>
        <text x="100" y="105.3" ${TXT} font-size="7" fill="#2a1430">ugh. ok.</text>
        <path d="M28 138 H172 L188 152 H12 Z" fill="#b9b3c9"/>
        <rect x="84" y="141" width="32" height="4" rx="2" fill="#8f88a3"/>`
    },
    {
      id: 'phone', name: 'a phone', hp: 4, value: 80, colors: ['#2a2438', '#ffb3d9', '#fff4ea', '#c4a6ff'],
      quip: 'Notifications: permanently silenced.',
      svg: `<rect x="72" y="18" width="56" height="132" rx="12" fill="#2a2438"/>
        <rect x="77" y="30" width="46" height="106" rx="4" fill="#ffb3d9"/>
        <rect x="92" y="22" width="16" height="4" rx="2" fill="#4a4060"/>
        <rect x="81" y="38" width="38" height="16" rx="5" fill="#fff4ea"/><text x="100" y="49" ${TXT} font-size="8" fill="#2a1430">ping!</text>
        <rect x="81" y="58" width="38" height="16" rx="5" fill="#fff4ea"/><text x="100" y="69" ${TXT} font-size="8" fill="#2a1430">ping!!</text>
        <rect x="81" y="78" width="38" height="16" rx="5" fill="#fff4ea"/><text x="100" y="89" ${TXT} font-size="8" fill="#2a1430">reply pls</text>
        <rect x="81" y="98" width="38" height="16" rx="5" fill="#fff4ea"/><text x="100" y="109" ${TXT} font-size="8" fill="#ff3b6b">??????</text>
        <circle cx="100" cy="143" r="3.5" fill="#4a4060"/>`
    },
    {
      id: 'plates', name: 'a stack of plates', hp: 3, value: 60, colors: ['#fff4ea', '#c4a6ff', '#ff9fd0', '#ecdcff'],
      quip: 'Opa! Very cathartic of you.',
      svg: `<g stroke="#c4a6ff" stroke-width="2" fill="#fff4ea">
          <ellipse cx="100" cy="146" rx="68" ry="13"/><ellipse cx="100" cy="137" rx="68" ry="13"/>
          <ellipse cx="100" cy="128" rx="68" ry="13"/><ellipse cx="100" cy="119" rx="68" ry="13"/>
          <ellipse cx="100" cy="110" rx="68" ry="13"/>
        </g>
        <ellipse cx="100" cy="110" rx="44" ry="7" fill="#ecdcff"/>
        <ellipse cx="100" cy="110" rx="57" ry="10.5" fill="none" stroke="#ff9fd0" stroke-width="2" stroke-dasharray="4 5"/>`
    },
    {
      id: 'pumpkin', name: 'a pumpkin', hp: 5, value: 90, colors: ['#ff9a3c', '#e86a10', '#ffd54a', '#6fc04a'],
      quip: 'Seasonally appropriate rage.',
      svg: `<defs><radialGradient id="gPump" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffb565"/><stop offset="1" stop-color="#e86a10"/></radialGradient></defs>
        <rect x="93" y="40" width="14" height="22" rx="5" fill="#4c8a2a"/>
        <path d="M107 50 q16 -14 26 -4 q-12 2 -22 10z" fill="#6fc04a"/>
        <ellipse cx="100" cy="104" rx="76" ry="50" fill="url(#gPump)"/>
        <g fill="none" stroke="rgba(160,60,0,.35)" stroke-width="3"><ellipse cx="70" cy="104" rx="18" ry="48"/><ellipse cx="100" cy="104" rx="16" ry="50"/><ellipse cx="130" cy="104" rx="18" ry="48"/></g>
        <g fill="#ffd54a"><path d="M62 92 l14 -18 l14 18z"/><path d="M110 92 l14 -18 l14 18z"/>
        <path d="M64 112 Q100 140 136 112 L126 116 L120 110 L114 118 L106 111 L100 119 L94 111 L86 118 L80 110 L74 116 Z"/></g>`
    },
    {
      id: 'printer', name: 'a printer', hp: 9, value: 150, colors: ['#e9e4f2', '#d3cbe3', '#2a2438', '#fff', '#ff3b6b'],
      quip: 'Paper jam: resolved. Forever.',
      svg: `<rect x="58" y="22" width="84" height="46" fill="#ffffff" stroke="#c4a6ff" stroke-width="2"/>
        <g stroke="#c4a6ff" stroke-width="2"><path d="M68 34h50M68 42h60M68 50h40"/></g>
        <rect x="28" y="58" width="144" height="80" rx="12" fill="#e9e4f2"/>
        <rect x="28" y="58" width="144" height="18" rx="9" fill="#d3cbe3"/>
        <rect x="44" y="86" width="64" height="20" rx="4" fill="#2a2438"/>
        <text x="76" y="100" ${TXT} font-size="11" fill="#ff3b6b">PAPER JAM</text>
        <circle cx="130" cy="96" r="6" fill="#ff3b6b"/><circle cx="150" cy="96" r="6" fill="#ffd54a"/>
        <rect x="34" y="136" width="14" height="12" rx="2" fill="#8f88a3"/><rect x="152" y="136" width="14" height="12" rx="2" fill="#8f88a3"/>
        <rect x="50" y="116" width="100" height="8" rx="4" fill="#8f88a3"/>
        <path d="M66 121 h70 l-4 10 l6 8 l-8 11 h-60 l4 -9 l-6 -9z" fill="#fff" stroke="#c4a6ff" stroke-width="2"/>`
    },
    {
      id: 'tv', name: 'an old TV', hp: 8, value: 140, colors: ['#9a6440', '#cfd0e0', '#6b4228', '#ff9fd0'],
      quip: 'No more bad news on this channel.',
      svg: `<g stroke="#3a2a1a" stroke-width="3" stroke-linecap="round"><path d="M100 44 L72 12"/><path d="M100 44 L130 14"/></g>
        <circle cx="72" cy="12" r="4.5" fill="#ff9fd0"/><circle cx="130" cy="14" r="4.5" fill="#ff9fd0"/>
        <rect x="30" y="42" width="140" height="98" rx="16" fill="#9a6440"/>
        <rect x="40" y="52" width="94" height="78" rx="16" fill="#cfd0e0"/>
        <g stroke="#a8a8c0" stroke-width="2"><path d="M48 64h78M48 74h68M52 84h74M48 104h62M52 114h72"/></g>
        <rect x="56" y="86" width="62" height="16" rx="4" fill="#2a1430"/>
        <text x="87" y="98" ${TXT} font-size="10" fill="#fff4ea">NO SIGNAL</text>
        <circle cx="152" cy="70" r="8" fill="#e8d3b5"/><circle cx="152" cy="94" r="8" fill="#e8d3b5"/>
        <g fill="#3a2a1a"><rect x="148" y="110" width="8" height="2"/><rect x="148" y="115" width="8" height="2"/><rect x="148" y="120" width="8" height="2"/></g>
        <rect x="46" y="138" width="10" height="13" rx="2" fill="#6b4228"/><rect x="144" y="138" width="10" height="13" rx="2" fill="#6b4228"/>`
    },
    {
      id: 'vase', name: 'a fancy vase', hp: 3, value: 70, colors: ['#c4a6ff', '#7a5ac0', '#ff9fd0', '#ff3b6b', '#6fc04a'],
      quip: 'It was kind of ugly anyway.',
      svg: `<path d="M98 44 Q94 22 98 10" stroke="#4c8a2a" stroke-width="3" fill="none"/>
        <path d="M90 12 q8 -12 16 0 q-2 10 -8 10 q-6 0 -8 -10z" fill="#ff3b6b"/>
        <path d="M104 44 Q116 28 126 22" stroke="#4c8a2a" stroke-width="3" fill="none"/>
        <g fill="#ff9fd0"><circle cx="126" cy="14" r="5"/><circle cx="133" cy="20" r="5"/><circle cx="127" cy="27" r="5"/><circle cx="119" cy="21" r="5"/></g>
        <circle cx="126" cy="20" r="3.5" fill="#ffd54a"/>
        <path d="M82 40 h36 v8 q-4 6 0 14 q32 24 26 62 q-4 30 -44 30 q-40 0 -44 -30 q-6 -38 26 -62 q4 -8 0 -14z" fill="#c4a6ff" stroke="#7a5ac0" stroke-width="2"/>
        <path d="M62 100 q38 10 76 0" stroke="#ff9fd0" stroke-width="8" fill="none"/>
        <g fill="#fff4ea"><circle cx="80" cy="122" r="3"/><circle cx="100" cy="127" r="3"/><circle cx="120" cy="122" r="3"/></g>`
    },
    {
      id: 'keyboard', name: 'a keyboard', hp: 6, value: 100, colors: ['#3d3654', '#c4a6ff', '#ff9fd0', '#fff4ea'],
      quip: 'Ctrl + Alt + Destroyed.',
      svg: `<path d="M100 80 q0 -30 30 -40 q20 -6 40 -30" stroke="#3d3654" stroke-width="3" fill="none"/>
        <rect x="12" y="84" width="176" height="64" rx="9" fill="#2a2438"/>
        <rect x="12" y="80" width="176" height="62" rx="9" fill="#3d3654"/>
        ${keyboardKeys}`
    }
  ];

  const LINES = [
    'Breathe in. Smash out.', 'That one had it coming.', 'Look at you, handling things.',
    'Stress level: going down.', 'One less thing to worry about.', 'Deadlines cannot hurt you here.',
    'Proud of you for letting it out.', 'You are stronger than you think.', 'Big final girl energy.',
    'Shake it off. Then smash it.', 'Feelings: valid. Object: gone.', 'Tiny victory. Still counts.',
    'You did that. Iconic.', 'Let it go. Loudly.'
  ];

  // ---------- audio (synth, no files) ----------
  let actx = null, noiseBuf = null;
  const ensureAudio = () => {
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      try {
        actx = new C();
        const len = actx.sampleRate;
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { actx = null; return; }
    }
    if (actx.state === 'suspended') actx.resume();
  };
  const env = (g, t, peak, dur) => {
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  };
  const tone = (type, f0, f1, t, peak, dur) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, peak, dur); o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + .03);
  };
  const noise = (t, freq, q, peak, dur, type) => {
    const n = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    n.buffer = noiseBuf; f.type = type || 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    env(g, t, peak, dur); n.connect(f); f.connect(g); g.connect(actx.destination);
    n.start(t, Math.random() * .4); n.stop(t + dur + .03);
  };
  const playHit = tl => {
    if (state.muted || !actx) return;
    const t = actx.currentTime;
    tone('triangle', tl.pitch, tl.pitch * .4, t, .45, .2);
    noise(t, tl.noiseF, 1.1, .5, .14);
    if (tl.ring) { tone('sine', 880, null, t, .16, .55); tone('sine', 1320, null, t, .09, .4); }
    if (tl.quake) tone('sine', 70, 38, t, .6, .35);
  };
  const playBreak = () => {
    if (state.muted || !actx) return;
    const t = actx.currentTime;
    noise(t, 1800, .6, .6, .5);
    noise(t + .02, 5200, 1.5, .3, .35, 'highpass');
    tone('sine', 110, 45, t, .5, .3);
    for (let i = 0; i < 6; i++) tone('sine', rnd(1800, 4200), null, t + .05 + i * .045, .1, .18);
  };

  // ---------- shard / confetti particles ----------
  const fx = $('fx'), fctx = fx.getContext('2d');
  let FW, FH;
  const fsize = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    FW = innerWidth; FH = innerHeight;
    fx.width = FW * dpr; fx.height = FH * dpr;
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fsize(); addEventListener('resize', fsize);
  let parts = [], running = false;
  const CONFETTI = ['#ff9fd0', '#c4a6ff', '#ff9a3c', '#fff4ea', '#ffd54a'];
  const spawnParts = (x, y, colors, n, power) => {
    for (let i = 0; i < n; i++) {
      const conf = Math.random() < .35;
      const s = conf ? rnd(5, 9) : rnd(8, 20) * Math.max(.5, power);
      const k = conf ? 4 : (Math.random() < .6 ? 3 : 4);
      const pts = [];
      for (let j = 0; j < k; j++) {
        const a = j / k * Math.PI * 2 + rnd(-.4, .4);
        const rr = conf ? s * (j % 2 ? .45 : 1) : s * rnd(.5, 1);
        pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
      parts.push({ x, y, vx: rnd(-7, 7) * power, vy: rnd(-13, -4) * power, r: rnd(0, 6.3), vr: rnd(-.35, .35), pts, c: conf ? pick(CONFETTI) : pick(colors), life: 0, max: rnd(60, 95) });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  };
  const tick = () => {
    fctx.clearRect(0, 0, FW, FH);
    parts = parts.filter(p => p.life < p.max && p.y < FH + 60);
    for (const p of parts) {
      p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      fctx.save();
      fctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      fctx.translate(p.x, p.y); fctx.rotate(p.r);
      fctx.fillStyle = p.c; fctx.beginPath();
      fctx.moveTo(p.pts[0][0], p.pts[0][1]);
      for (let j = 1; j < p.pts.length; j++) fctx.lineTo(p.pts[j][0], p.pts[j][1]);
      fctx.closePath(); fctx.fill();
      fctx.strokeStyle = 'rgba(26,16,48,.5)'; fctx.lineWidth = 1.5; fctx.stroke();
      fctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick);
    else { running = false; fctx.clearRect(0, 0, FW, FH); }
  };

  // ---------- UI helpers ----------
  const stage = $('stage'), target = $('target'), msg = $('msg');
  const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const renderBoard = () => {
    $('sPoints').textContent = state.points.toLocaleString();
    $('sSmashed').textContent = state.smashed.toLocaleString();
    $('sBest').textContent = state.best.toLocaleString();
  };
  const popAt = (cls, text, cx, cy) => {
    const r = stage.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = cls; el.textContent = text;
    el.style.left = clamp(cx - r.left, 60, r.width - 60) + 'px';
    el.style.top = clamp(cy - r.top, 50, r.height - 30) + 'px';
    el.style.setProperty('--r', rnd(-14, 14).toFixed(1) + 'deg');
    stage.appendChild(el);
    setTimeout(() => el.remove(), 1150);
  };
  const swingAt = (cx, cy) => {
    if (reduce) return;
    const r = stage.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'swing'; el.innerHTML = TOOLS[state.tool].svg;
    el.style.left = (cx - r.left) + 'px'; el.style.top = (cy - r.top) + 'px';
    stage.appendChild(el);
    setTimeout(() => el.remove(), 300);
  };
  const showMsg = text => { msg.textContent = text; restart(msg, 'pop'); };
  const buzz = ms => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

  // ---------- cracks ----------
  const addCracks = (svg, cx, cy, dmg, mul) => {
    const g = svg.querySelector('.cracks'), art = svg.querySelector('.art');
    let p;
    try {
      const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy;
      p = pt.matrixTransform(svg.getScreenCTM().inverse());
    } catch (e) { p = { x: 100, y: 100 }; }
    let b;
    try { b = art.getBBox(); } catch (e) { b = { x: 20, y: 20, width: 160, height: 130 }; }
    const minX = b.x + 6, maxX = b.x + b.width - 6, minY = b.y + 6, maxY = b.y + b.height - 6;
    p.x = clamp(p.x, minX, maxX); p.y = clamp(p.y, minY, maxY);
    const branches = Math.max(2, Math.round((2 + dmg) * mul));
    const f = n => n.toFixed(1);
    let d = '';
    for (let i = 0; i < branches; i++) {
      let a = rnd(0, Math.PI * 2), x = p.x, y = p.y;
      d += `M${f(x)} ${f(y)}`;
      const segs = 3 + Math.floor(Math.random() * 2), len = rnd(8, 14) * (1 + dmg * .12);
      for (let s = 0; s < segs; s++) {
        a += rnd(-.6, .6);
        x = clamp(x + Math.cos(a) * len, minX, maxX);
        y = clamp(y + Math.sin(a) * len, minY, maxY);
        d += ` L${f(x)} ${f(y)}`;
        if (Math.random() < .3) {
          const a2 = a + rnd(.6, 1.2) * (Math.random() < .5 ? -1 : 1);
          d += ` M${f(x)} ${f(y)} l${f(Math.cos(a2) * len * .7)} ${f(Math.sin(a2) * len * .7)} M${f(x)} ${f(y)}`;
        }
      }
    }
    g.insertAdjacentHTML('beforeend',
      `<path d="${d}" stroke="rgba(255,244,234,.7)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="${d}" stroke="#1a1030" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<circle cx="${f(p.x)}" cy="${f(p.y)}" r="${2 + dmg}" fill="#1a1030"/>`);
  };

  // ---------- game loop ----------
  const COMBO_WINDOW = 1000;
  let bag = [], cur = null, busy = true, lastId = null;
  let combo = 0, lastHit = 0, comboTimer = null;
  const multFor = c => c >= 16 ? 5 : c >= 11 ? 4 : c >= 7 ? 3 : c >= 4 ? 2 : 1;

  const nextDef = () => {
    if (!bag.length) {
      bag = OBJECTS.slice().sort(() => Math.random() - .5);
      if (bag[bag.length - 1].id === lastId) [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
    }
    return bag.pop();
  };

  const spawnObject = () => {
    const d = nextDef(); lastId = d.id;
    cur = Object.assign({}, d, { hpLeft: d.hp });
    target.innerHTML = `<svg class="obj" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="art">${d.svg}</g><g class="cracks"></g></svg>`;
    target.setAttribute('aria-label', `Smash ${d.name}`);
    $('objname').textContent = `up next: ${d.name}`;
    $('hpFill').style.width = '100%';
    target.className = 'enter';
    setTimeout(() => target.classList.remove('enter'), 600);
    busy = false;
  };

  const endCombo = () => { combo = 0; $('combo').hidden = true; };
  const showCombo = m => {
    const box = $('combo'), bar = $('comboBar');
    box.hidden = combo < 2;
    $('comboTxt').textContent = `combo ${combo} · x${m}`;
    bar.style.setProperty('--ms', COMBO_WINDOW + 'ms');
    restart(bar, 'run');
  };

  const hit = (cx, cy) => {
    if (busy || !cur) return;
    ensureAudio();
    const tl = TOOLS[state.tool];
    const now = performance.now();
    const prevM = multFor(combo);
    combo = (now - lastHit < COMBO_WINDOW) ? combo + 1 : 1;
    lastHit = now;
    if (combo > state.best) state.best = combo;
    const m = multFor(combo);

    cur.hpLeft -= tl.dmg;
    state.points += 5 * tl.dmg * m;

    const svg = target.querySelector('svg');
    addCracks(svg, cx, cy, tl.dmg, tl.cracks);
    const ratio = Math.max(0, cur.hpLeft / cur.hp);
    svg.querySelector('.art').style.filter = `brightness(${(1 - .3 * (1 - ratio)).toFixed(2)}) saturate(${(1 - .25 * (1 - ratio)).toFixed(2)})`;
    $('hpFill').style.width = (ratio * 100) + '%';

    target.classList.remove('enter');
    restart(target, 'shake');
    if (tl.quake && !reduce) restart(stage, 'quake');
    swingAt(cx, cy);
    popAt('word', pick(tl.words), cx, cy - 10);
    spawnParts(cx, cy, cur.colors, 5, .45);
    playHit(tl);
    buzz(tl.dmg * 8);

    clearTimeout(comboTimer);
    comboTimer = setTimeout(endCombo, COMBO_WINDOW);
    showCombo(m);
    if (m > prevM && m > 1) {
      const r = stage.getBoundingClientRect();
      popAt('word big', `x${m} COMBO!`, r.left + r.width / 2, r.top + r.height * .32);
    }

    if (cur.hpLeft <= 0) smash(m);
    else { save(); renderBoard(); }
  };

  const smash = m => {
    busy = true;
    const bonus = cur.value * m;
    state.points += bonus; state.smashed++;
    save(); renderBoard();
    const r = target.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height * .55;
    spawnParts(cx, cy, cur.colors, reduce ? 20 : 52, 1);
    target.className = 'gone';
    popAt('plus', `+${bonus.toLocaleString()}${m > 1 ? ` (x${m})` : ''}`, cx, cy - 20);
    playBreak();
    buzz([20, 30, 40]);
    showMsg(Math.random() < .5 ? cur.quip : pick(LINES));
    $('objname').textContent = `${cur.name.replace(/^an? /, '')}: destroyed`;
    // give her a moment to keep the combo going into the next object
    clearTimeout(comboTimer);
    comboTimer = setTimeout(endCombo, COMBO_WINDOW + 700);
    setTimeout(spawnObject, 600);
  };

  target.addEventListener('pointerdown', e => { e.preventDefault(); hit(e.clientX, e.clientY); });
  target.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const r = target.getBoundingClientRect();
      hit(r.left + r.width * rnd(.35, .65), r.top + r.height * rnd(.4, .7));
    }
  });

  // ---------- mute + reset ----------
  const muteBtn = $('mute');
  const renderMute = () => {
    muteBtn.textContent = state.muted ? '🔇 sound off' : '🔊 sound on';
    muteBtn.setAttribute('aria-pressed', String(state.muted));
  };
  muteBtn.addEventListener('click', () => { state.muted = !state.muted; save(); renderMute(); if (!state.muted) ensureAudio(); });
  $('reset').addEventListener('click', () => {
    if (!confirm('Reset points, smashed count and best combo?')) return;
    state.points = 0; state.smashed = 0; state.best = 0; save(); renderBoard();
    showMsg('Fresh start. Go get em.');
  });

  renderMute();
  renderBoard();
  spawnObject();
})();
</script>
</body>
</html>
